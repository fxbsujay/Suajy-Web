<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>色差混合</title>
  <style>

    .bg {
      background: linear-gradient(135deg, #fff 50%, #000 50%);
      height: 500px;
      width: 500px;
      margin: 100px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg .text {
      font-size: 40px;
      color: #fff;
      font-weight: bold;
      letter-spacing: 5px;
      mix-blend-mode: difference;
    }
  </style>
</head>
<body>

  <div class="bg">
    <span class="text">色差混合</span>
  </div>

</body>
</html>
